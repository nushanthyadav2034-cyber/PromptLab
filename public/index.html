<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PromptLab</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #333; }
    h1 { color: #1a73e8; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: bold; margin-bottom: 8px; }
    select, textarea, button { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    textarea { height: 140px; resize: vertical; }
    button { background-color: #1a73e8; color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background-color: #1557b0; }
    button:disabled { background-color: #9aa0a6; cursor: not-allowed; }
    .result-box { margin-top: 24px; padding: 16px; background-color: #f8f9fa; border: 1px solid #dadce0; border-radius: 6px; white-space: pre-wrap; }
    .error { color: #d93025; background-color: #fce8e6; border-color: #f5c6cb; }
    .footer-note { margin-top: 40px; padding: 12px; background: #e8f0fe; border-radius: 6px; font-size: 14px; color: #1967d2; }
  </style>
</head>
<body>

  <h1>PromptLab</h1>
  <p>Select a AI prompt transformation template and enter your input.</p>

  <div class="form-group">
    <label for="templateId">Choose Template</label>
    <select id="templateId">
      <option value="summarize">Summarize Text</option>
      <option value="rewrite_professional">Rewrite Professionally</option>
      <option value="explain_eli5">Explain Like I'm 5</option>
    </select>
  </div>

  <div class="form-group">
    <label for="userInput">Your Input Text</label>
    <textarea id="userInput" placeholder="Type or paste your content here..."></textarea>
  </div>

  <button id="generateBtn">Generate</button>

  <div id="outputContainer" style="display: none;" class="result-box"></div>

  <div class="footer-note">
    <strong>Responsible AI Notice:</strong> Generative AI can produce inaccurate responses. Verify critical output before reliance, and do not submit personal or confidential data.
  </div>

  <script src="script.js"></script>
</body>
</html>
